name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  dylib:
    # macos-13 = Intel(x86_64) runner，避免账号不支持 arm64 macOS 变体的问题
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          uname -m
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build dylib
        run: |
          export SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CLANG="$(xcrun --sdk iphoneos -f clang)"
          export MIN_IOS=14.0
          export ARCHS=arm64
          bash ./build.sh

      - name: Verify artifact
        run: |
          lipo -info build/YuanbaoCheckin.dylib
          ls -lh build/YuanbaoCheckin.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: YuanbaoCheckin-dylib
          path: build/YuanbaoCheckin.dylib
          if-no-files-found: error